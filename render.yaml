services:
  - type: web
    name: checkup-buddy
    runtime: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run app.py --server.port $PORT --server.address 0.0.0.0
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: OWNER_EMAIL
        sync: false
      - key: OWNER_PASSWORD
        sync: false
      - key: OWNER_USERNAME
        value: admin
      - key: SMTP_USER
        sync: false
      - key: SMTP_APP_PASSWORD
        sync: false

